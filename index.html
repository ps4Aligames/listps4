<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALI GAMES - PS4 200 - FINAL NO IMPORT EXPORT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0310F2;color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden;position:relative}
.header{position:relative;background:#0310F2;overflow:hidden;min-height:350px;z-index:10}
.bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%;opacity:0.85;z-index:1;filter:brightness(1.35) contrast(1.25) saturate(1.2)}
.bg-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center 35%, rgba(3,16,242,0.02) 10%, rgba(3,16,242,0.1) 40%, rgba(3,16,242,0.7) 85%);z-index:2}
.overlay1,.overlay2{position:absolute;inset:0;z-index:2}
.overlay1{background:linear-gradient(180deg,rgba(3,16,242,0.05) 0%, rgba(3,16,242,0.05) 30%, rgba(3,16,242,0.6) 85%)}
.overlay2{background:linear-gradient(90deg,rgba(3,16,242,0.15) 0%, rgba(3,16,242,0.02) 50%, rgba(3,16,242,0.2) 100%)}
.content{position:relative;z-index:6;padding:24px 20px 12px;max-width:760px}
.brand-title h1{font-size:28px;font-weight:900;color:#fff}
.brand-sub{color:#d0d6ff;font-size:11px;letter-spacing:2px;margin-top:8px;font-weight:700}
.big-title{margin-top:28px;font-weight:900;line-height:.88;letter-spacing:-1.5px;font-size:44px;text-shadow:0 3px 20px rgba(0,0,0,0.8)}
.big-title .white{color:#fff;display:block}
.info{margin-top:22px;display:flex;gap:14px}
.icon-circle{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center}
.info-text .main{font-size:14px;font-weight:700;color:#fff}
.info-text .sub{font-size:12px;color:#d0d6ff;margin-top:3px}
.wa-btn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#0310F2;font-weight:900;font-size:15px;padding:15px 26px;border-radius:999px;margin-top:12px;cursor:pointer;border:0}
.section{padding:4px 20px 30px;background:transparent;border-top:1px solid rgba(255,255,255,.25);position:relative;z-index:10;min-height:80vh}
.koleksi-label{display:flex;align-items:center;gap:12px}
.line{width:32px;height:1.5px;background:#fff}
.koleksi-label span{color:#fff;font-size:11px;letter-spacing:3px;font-weight:700}
.section-title{font-size:30px;font-weight:800;margin-top:18px;color:#fff}
.section-title .muted{color:#a8b4ff}
.chips{display:flex;gap:8px;overflow:auto;padding:18px 0}
.chip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 16px;border-radius:999px;font-size:12px;white-space:nowrap;cursor:pointer}
.chip.on{background:#fff;color:#0310F2}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-bottom:160px;position:relative;z-index:10}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#0f0f0f;border:1px solid rgba(255,255,255,.25);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;z-index:10}
.card.on{border-color:#fff;box-shadow:0 0 0 2px #fff}
.cover{aspect-ratio:3/4;position:relative;overflow:hidden;background:#111}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge-num{position:absolute;top:8px;right:8px;background:#fff;color:#0310F2;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;z-index:3}
.foot{padding:10px;background:#111}
.foot input{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:6px}
.foot input.small{font-size:11px;color:#aaa}
.manual-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;position:relative;z-index:11}
.manual-btn{background:#fff;color:#0310F2;font-weight:800;font-size:13px;padding:11px 18px;border-radius:999px;border:0;cursor:pointer}
.manual-btn.dark{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4)}
.manual-btn.green{background:#00e676;color:#000}
.manual-btn.blue{background:#2962ff;color:#fff}
.cover .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#888;font-size:11px;text-align:center;padding:10px}
.remove-card{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.75);border:1px solid #333;color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:4}
.edit-badge{position:absolute;bottom:8px;left:8px;background:#fff;color:#000;font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px;z-index:4}
.sticky{position:fixed;bottom:0;left:0;right:0;background:rgba(3,16,242,.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.3);padding:14px 20px;z-index:60;display:flex;align-items:center;justify-content:space-between}
.search-fields{display:flex;flex-direction:column;gap:12px;margin:16px 0 12px;max-width:520px;position:relative;z-index:11}
#q,#cust{padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.18);color:#fff;font-weight:600}
#q::placeholder,#cust::placeholder{color:#d0d6ff}
#saveStatus{margin:8px 0 12px;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:600;display:none;position:relative;z-index:11}
.ps-rain-full{position:fixed;top:0;left:0;width:100%;height:100vh;overflow:hidden;z-index:5;pointer-events:none;display:block !important}
.ps-rain-header{position:absolute;inset:0;overflow:hidden;z-index:4;pointer-events:none;display:block !important}
.ps-drop{position:absolute;top:-100px;user-select:none;will-change:transform;animation-name:psFallNormal;animation-timing-function:linear;animation-iteration-count:infinite;font-weight:900;opacity:0;display:block !important}
@keyframes psFallNormal{0%{transform:translateY(-100px) translateX(0) rotate(0deg) scale(0.8);opacity:0}10%{opacity:0.95}80%{opacity:0.85}100%{transform:translateY(110vh) translateX(40px) rotate(360deg) scale(1.2);opacity:0}}
@keyframes psFallHeaderNormal{0%{transform:translateY(-100px) translateX(0) rotate(0deg) scale(0.8);opacity:0}10%{opacity:0.9}85%{opacity:0.7}100%{transform:translateY(400px) translateX(20px) rotate(360deg) scale(1.2);opacity:0}}
.ps-drop.triangle{color:#ffffff;text-shadow:0 0 6px #fff, 0 0 12px #fff;}
.ps-drop.circle{color:#ff4a4a;text-shadow:0 0 6px #ff4a4a, 0 0 12px #ff4a4a;}
.ps-drop.x{color:#5ad8ff;text-shadow:0 0 6px #5ad8ff, 0 0 12px #5ad8ff;}
.ps-drop.square{color:#ff8cff;text-shadow:0 0 6px #ff8cff, 0 0 12px #ff8cff;}
</style>

<script>
const GENRES=["Semua","Action Adventure","Open World","FPS / Shooting","RPG / Anime / Musou","Fighting","Racing","Sports","Family / Casual"];
const GENRE_ID={"Semua":"Semua","Action Adventure":"Aksi & Petualangan","Open World":"Dunia Terbuka","FPS / Shooting":"Tembak-menembak","RPG / Anime / Musou":"RPG / Anime / Perang Massal","Fighting":"Pertarungan","Racing":"Balapan","Sports":"Olahraga","Family / Casual":"Keluarga & Santai"};
function genreLabel(g){return GENRE_ID[g]||g;}
let active="Semua";let GAMES=[];let sel=new Set();let pendingCoverIndex=null;

const DB_NAME='AliGamesDB_Final_NoImport';
const STORE_NAME='manual';

function openDB(){
  return new Promise((resolve, reject)=>{
    const req=indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
    };
    req.onsuccess=e=>resolve(e.target.result);
    req.onerror=e=>reject(e.target.error);
  });
}
async function saveToDB(){
  try{
    const db=await openDB();
    const tx=db.transaction(STORE_NAME,'readwrite');
    tx.objectStore(STORE_NAME).put(GAMES, 'games');
    return new Promise((res,rej)=>{tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);});
  }catch(e){return false;}
}
async function loadFromDB(){
  try{
    const db=await openDB();
    const tx=db.transaction(STORE_NAME,'readonly');
    const req=tx.objectStore(STORE_NAME).get('games');
    return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error);});
  }catch(e){return null;}
}

function showStatus(msg, ok){
  const el=document.getElementById('saveStatus');
  el.textContent=msg;
  el.style.display='block';
  el.style.background=ok?'rgba(0,230,118,0.15)':'rgba(255,204,106,0.15)';
  el.style.border='1px solid '+(ok?'rgba(0,230,118,0.4)':'rgba(255,204,106,0.4)');
  el.style.color=ok?'#a8ffbf':'#ffcc6a';
  setTimeout(()=>el.style.display='none',4000);
  document.getElementById('autoSaveInfo').textContent=msg;
  setTimeout(()=>{document.getElementById('autoSaveInfo').textContent='Auto-save aktif - '+GAMES.filter(g=>g.title||g.cover).length+' terisi'},3000);
}

async function saveManual(){
  const ok=await saveToDB();
  if(ok) showStatus('✅ Tersimpan otomatis! '+GAMES.filter(g=>g.title||g.cover).length+' game', true);
  else showStatus('❌ Gagal simpan', false);
}

function saveToGitHub(){
  saveManual();
  const htmlContent=document.documentElement.outerHTML;
  const blob=new Blob([htmlContent],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='index.html';
  a.click();
  URL.revokeObjectURL(url);
  showStatus('🚀 index.html ter-download, upload ke ps4aligames/DAFTARgameps4', true);
}

let saveTimeout=null;
function autoSave(){
  clearTimeout(saveTimeout);
  document.getElementById('autoSaveInfo').textContent='Menyimpan...';
  saveTimeout=setTimeout(async ()=>{await saveManual();}, 600);
}

function renderChips(){
  const c=document.getElementById('chips');c.innerHTML='';
  GENRES.forEach(g=>{
    const cnt=g==='Semua'?GAMES.length:GAMES.filter(x=>x.genre===g).length;
    const b=document.createElement('button');
    b.className='chip'+(active===g?' on':'');
    b.textContent=genreLabel(g)+' ('+cnt+')';
    b.onclick=()=>{active=g;renderChips();render();};
    c.appendChild(b);
  });
}
function addCard(){GAMES.push({title:"",code:"",genre:"Action Adventure",cover:""});renderChips();render();autoSave();}
function addCardBulk(){for(let i=0;i<4;i++) GAMES.push({title:"",code:"",genre:"Action Adventure",cover:""});renderChips();render();autoSave();}
function clearAll(){if(!confirm('Reset 200 slot kosong?')) return;GAMES=[];for(let i=0;i<200;i++) GAMES.push({title:"",code:"",genre:"Action Adventure",cover:""});sel.clear();renderChips();render();saveManual();}
function removeCard(idx){GAMES.splice(idx,1);const n=new Set();sel.forEach(i=>{if(i<idx) n.add(i); else if(i>idx) n.add(i-1);});sel=n;renderChips();render();autoSave();}
function pickCover(idx){pendingCoverIndex=idx;document.getElementById('filePicker').click();}
document.getElementById('filePicker').addEventListener('change', e=>{
  const file=e.target.files[0];
  if(!file || pendingCoverIndex===null) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    GAMES[pendingCoverIndex].cover=ev.target.result;
    render();
    autoSave();
    showStatus('📸 Foto terpasang + auto-save', true);
  };
  reader.readAsDataURL(file);
  e.target.value='';
});
function coverHtml(g,idx){
  if(g.cover) return '<div class="cover"><img src="'+g.cover+'"><div class="badge-num">'+(idx+1)+'</div><button class="remove-card" onclick="event.stopPropagation();removeCard('+idx+')">x</button><div class="edit-badge" onclick="event.stopPropagation();pickCover('+idx+')">GANTI</div></div>';
  return '<div class="cover" style="background:#0e0e0e;border:2px dashed #555"><div class="placeholder"><b>COVER KOSONG</b><span>Klik foto</span></div><div class="badge-num">'+(idx+1)+'</div><button class="remove-card" onclick="event.stopPropagation();removeCard('+idx+')">x</button></div>';
}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const grid=document.getElementById('grid');grid.innerHTML='';
  let list=GAMES.map((g,i)=>({g,i})).filter(({g})=> active==='Semua'||g.genre===active).filter(({g})=> !q|| (g.title+' '+g.code).toLowerCase().includes(q));
  list.forEach(({g,i:realIdx})=>{
    const on=sel.has(realIdx);
    const card=document.createElement('div');card.className='card'+(on?' on':'');
    const st=(g.title||'').replace(/"/g,'&quot;');const sc=(g.code||'').replace(/"/g,'&quot;');
    card.innerHTML=coverHtml(g,realIdx)+'<div class="foot"><input placeholder="Judul PS4..." value="'+st+'" oninput="GAMES['+realIdx+'].title=this.value;autoSave()" onclick="event.stopPropagation()"><input class="small" placeholder="Kode..." value="'+sc+'" oninput="GAMES['+realIdx+'].code=this.value;autoSave()" onclick="event.stopPropagation()"></div>';
    card.onclick=(e)=>{if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON') return;if(!GAMES[realIdx].cover){pickCover(realIdx);return;}if(sel.has(realIdx)) sel.delete(realIdx);else sel.add(realIdx);render();};
    grid.appendChild(card);
  });
  document.getElementById('cnt').textContent=sel.size+' dipilih';
}
function grouped(){const m={};Array.from(sel).forEach(i=>{const g=GAMES[i];if(!g) return;const gr=g.genre||'Action Adventure';if(!m[gr]) m[gr]=[];m[gr].push(g);});return m;}
function make(){const cust=document.getElementById('cust').value.trim();if(!cust){alert('Isi nama pembeli');return '';}if(!sel.size){alert('Pilih game');return '';}let t='';const map=grouped();Object.keys(map).forEach(gr=>{t+='['+genreLabel(gr)+']\n';map[gr].forEach((g,i)=>{t+=(i+1)+'. '+(g.title||'Tanpa Judul')+(g.code?' - '+g.code:'')+'\n';});t+='\n';});return 'Halo Ali Games, order PS4:\n'+t+'Total: '+sel.size+' game\nNama: '+cust;}
function openEditor(){const msg=make();if(!msg) return;document.getElementById('orderText').value=msg;document.getElementById('orderEditor').style.display='flex';}
function sendEdited(){const m=document.getElementById('orderText').value.trim();if(!m) return;window.open('https://wa.me/62895708629977?text='+encodeURIComponent(m),'_blank');}
function closeEditor(){document.getElementById('orderEditor').style.display='none';}

(async function init(){
  document.getElementById('autoSaveInfo').textContent='Loading...';
  const saved=await loadFromDB();
  if(saved && Array.isArray(saved) && saved.length>0){
    GAMES=saved;
    showStatus('✅ Auto-load '+GAMES.filter(g=>g.title||g.cover).length+' game', true);
  }else{
    for(let i=0;i<200;i++) GAMES.push({title:"",code:"",genre:"Action Adventure",cover:""});
    showStatus('ℹ️ 200 slot siap - auto-save aktif', true);
  }
  renderChips();render();
})();

document.getElementById('q').addEventListener('input', render);

function createRainNormal(){
  const full=document.getElementById('psRainFull');
  const head=document.getElementById('psRainHeader');
  if(!full) return;
  full.innerHTML=''; head.innerHTML='';
  const symbols=[{char:'△',cls:'triangle'},{char:'○',cls:'circle'},{char:'×',cls:'x'},{char:'□',cls:'square'}];
  for(let i=0;i<65;i++){
    const s=symbols[Math.floor(Math.random()*symbols.length)];
    const el=document.createElement('div');
    el.className='ps-drop '+s.cls;
    el.textContent=s.char;
    el.style.left=(Math.random()*100)+'%';
    el.style.animationDelay=(Math.random()*10)+'s';
    el.style.animationDuration=(8+Math.random()*6)+'s';
    el.style.fontSize=(20+Math.random()*24)+'px';
    el.style.animationName='psFallNormal';
    full.appendChild(el);
  }
  for(let i=0;i<20;i++){
    const s=symbols[Math.floor(Math.random()*symbols.length)];
    const el=document.createElement('div');
    el.className='ps-drop '+s.cls;
    el.textContent=s.char;
    el.style.left=(Math.random()*100)+'%';
    el.style.animationDelay=(Math.random()*6)+'s';
    el.style.animationDuration=(6+Math.random()*5)+'s';
    el.style.fontSize=(18+Math.random()*18)+'px';
    el.style.animationName='psFallHeaderNormal';
    head.appendChild(el);
  }
}
createRainNormal();
